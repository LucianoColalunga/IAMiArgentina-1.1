# Modelos reales en CPU con llama.cpp (notebook o servidor sin GPU: demo y pruebas).
#
#   docker compose -f docker-compose.yml -f compose.cpu.yml --profile models up -d --build
#
# Usa archivos GGUF ya descargados en el volumen LLAMA_MODELS_VOLUME (solo lectura). Mismo
# camino de código que vLLM en producción: ambos exponen la API compatible con OpenAI.

x-llamacpp: &llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:82b5129742c04e12c4b710ae1908fd951f6b227339d45f0aa71f1165df353f70
  volumes:
    - llama-models:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 120s
  restart: unless-stopped

x-cpu-env: &cpu-env
  LLM_BASE_URL: http://llm:8080/v1
  LLM_MODEL: local-chat
  LLM_API_KEY: ${LOCAL_MODELS_API_KEY:-clave-local-de-prueba}
  EMBEDDINGS_BASE_URL: http://embeddings:8080/v1
  EMBEDDINGS_MODEL: bge-m3-q8
  EMBEDDINGS_API_KEY: ${LOCAL_MODELS_API_KEY:-clave-local-de-prueba}
  EMBEDDING_DIMENSIONS: "1024"
  # En CPU: menos contexto, respuestas más cortas y una generación a la vez.
  RETRIEVAL_TOP_K: "3"
  MAX_CONTEXT_TOKENS: "1200"
  MAX_OUTPUT_TOKENS: "350"
  LLM_TIMEOUT_SECONDS: "90"
  MAX_CONCURRENT_LLM_CALLS: "1"
  LLM_QUEUE_TIMEOUT_SECONDS: "120"
  CONTEXT_REWRITE_ENABLED: "false"

services:
  llm:
    <<: *llamacpp
    command:
      - -m
      - ${LOCAL_CHAT_GGUF:-/models/models--bartowski--Llama-3.2-3B-Instruct-GGUF/snapshots/5ab33fa94d1d04e903623ae72c95d1696f09f9e8/Llama-3.2-3B-Instruct-Q4_K_M.gguf}
      - --alias
      - local-chat
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key
      - ${LOCAL_MODELS_API_KEY:-clave-local-de-prueba}
      - --ctx-size
      - "8192"
      - --parallel
      - "2"
      - --n-predict
      - "384"
      - --no-webui

  embeddings:
    <<: *llamacpp
    command:
      - -m
      - ${LOCAL_EMBED_GGUF:-/models/models--gpustack--bge-m3-GGUF/snapshots/2d48f1737679ad900d5c26c5aad5410e9c70fdca/bge-m3-Q8_0.gguf}
      - --embeddings
      - --alias
      - bge-m3-q8
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key
      - ${LOCAL_MODELS_API_KEY:-clave-local-de-prueba}
      - --ctx-size
      - "8192"
      - --parallel
      - "4"
      - --batch-size
      - "2048"
      - --ubatch-size
      - "2048"
      - --no-webui

  ingest:
    environment:
      <<: *cpu-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy

  api:
    environment:
      <<: *cpu-env
  worker:
    environment:
      <<: *cpu-env
  maintenance:
    environment:
      <<: *cpu-env

volumes:
  llama-models:
    external: true
    name: ${LLAMA_MODELS_VOLUME:-mi-argentina-ia_llama-models}
