# Plataforma completa en una máquina (desarrollo, demo y pruebas de integración).
#
#   docker compose up -d --build                                   núcleo (sin modelos)
#   docker compose -f docker-compose.yml -f compose.cpu.yml up -d   + modelos reales en CPU (llama.cpp)
#   docker compose -f docker-compose.yml -f compose.gpu.yml up -d   + vLLM en GPU (servidor de producción)
#   docker compose -f docker-compose.yml -f compose.observability.yml up -d   + Prometheus/Grafana/Loki
#
# Solo nginx publica un puerto. PostgreSQL, Redis, RabbitMQ y los procesos de la aplicación
# quedan en la red interna de Docker. Copiar .env.example a .env y completar las claves
# (docker compose run --rm --no-deps api gen-secrets) antes del primer arranque.

name: iamia

x-backend: &backend
  image: iamia/backend:1.1.0
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    APP_ENV: ${APP_ENV:-development}
    DATABASE_URL: postgresql://iamia:${POSTGRES_PASSWORD:-iamia-local}@postgres:5432/iamia
    REDIS_URL: redis://:${REDIS_PASSWORD:-iamia-local}@redis:6379/0
    AMQP_URL: amqp://iamia:${RABBITMQ_PASSWORD:-iamia-local}@rabbitmq:5672/iamia
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    CHANNELS_ENABLED: ${CHANNELS_ENABLED:-webchat}
  # Endurecimiento: sistema de archivos de solo lectura, sin capacidades ni escalada de privilegios.
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

x-worker-health: &worker-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/readyz', timeout=2)"]
  interval: 15s
  timeout: 3s
  retries: 3
  start_period: 20s

services:
  # ------------------------------------------------------------------ datos
  postgres:
    image: iamia/postgres:16-pgvector
    build: infrastructure/docker/postgres
    environment:
      POSTGRES_DB: iamia
      POSTGRES_USER: iamia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iamia-local}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - maintenance_work_mem=256MB
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamia -d iamia"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.6-alpine
    # Solo cachés, deduplicación y límites: todo tiene TTL y se puede reconstruir.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-iamia-local}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-iamia-local}
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: iamia
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-iamia-local}
      RABBITMQ_DEFAULT_VHOST: iamia
    volumes:
      - ./infrastructure/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-iamia.conf:ro
      - ./infrastructure/docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------ tareas de una vez
  migrate:
    <<: *backend
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingest:
    <<: *backend
    command: ["ingest", "--if-empty"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["models"]
    restart: "no"

  # ------------------------------------------------------------------ aplicación
  api:
    <<: *backend
    command: ["api"]
    depends_on:
      <<: *depends-infra
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      <<: *depends-infra
      migrate:
        condition: service_completed_successfully
    healthcheck: *worker-health

  dispatcher:
    <<: *backend
    command: ["dispatcher"]
    depends_on:
      <<: *depends-infra
      migrate:
        condition: service_completed_successfully
    healthcheck: *worker-health

  maintenance:
    <<: *backend
    command: ["maintenance"]
    depends_on:
      <<: *depends-infra
      migrate:
        condition: service_completed_successfully
    healthcheck: *worker-health

  # ------------------------------------------------------------------ borde
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:-}
    volumes:
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq-data:
