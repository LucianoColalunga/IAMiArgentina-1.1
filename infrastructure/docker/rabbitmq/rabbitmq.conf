# Colas quorum por defecto para todo lo que declare la aplicación (replicadas en clúster).
default_queue_type = quorum

# Contrapresión: si el broker se queda sin memoria o disco bloquea a los publicadores y la API
# deja los mensajes guardados en PostgreSQL para que el sweeper los republique.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# Los consumidores tienen hasta 30 minutos para confirmar un mensaje (el worker usa leases de 3 min).
consumer_timeout = 1800000

# Métricas Prometheus en el puerto 15692 (/metrics y /metrics/detailed).
prometheus.return_per_object_metrics = false

log.console = true
log.console.level = warning
