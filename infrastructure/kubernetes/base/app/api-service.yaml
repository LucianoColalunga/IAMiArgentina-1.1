# Servicio interno de la API. Lo usan el ingress, oauth2-proxy y Prometheus (/metrics, que el
# Ingress nunca publica).
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: iamia
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iamia
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
