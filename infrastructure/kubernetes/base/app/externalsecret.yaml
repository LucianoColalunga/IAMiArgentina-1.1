# Secreto principal de la app (iamia-secrets), sincronizado desde Vault por External Secrets.
# El ClusterSecretStore "vault-backend" de cada cluster apunta al mount de su entorno
# (por ejemplo kv-staging o kv-production): los paths son los mismos en todos los overlays y un
# cluster de staging no puede leer secretos de producción.
# Claves esperadas en iamia/app: las de secret.example.yaml, con el mismo nombre.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iamia-secrets
  labels:
    app.kubernetes.io/name: iamia
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: iamia-secrets
    creationPolicy: Owner
    # Si se borra la clave en Vault, el Secret queda como estaba y la app no se cae.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: iamia/app
