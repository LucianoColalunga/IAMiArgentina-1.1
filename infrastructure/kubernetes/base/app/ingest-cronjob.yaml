# Reindexado semanal de la base de conocimiento desde las páginas oficiales.
# --if-changed: si el contenido no cambió no toca el índice activo.
# Forbid: nunca dos ingestas a la vez. Necesita salida a internet por 443 (NetworkPolicy en
# networkpolicies/jobs.yaml) y usa los datos (data/faqs, data/sources.txt) que trae la imagen.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest
  labels:
    app.kubernetes.io/name: iamia
    app.kubernetes.io/component: ingest
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Domingos 04:00 hora argentina, con poco tráfico.
  schedule: "0 4 * * 0"
  timeZone: America/Argentina/Buenos_Aires
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: iamia
        app.kubernetes.io/component: ingest
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: iamia
            app.kubernetes.io/component: ingest
        spec:
          restartPolicy: Never
          serviceAccountName: iamia
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              image: registry.example.org/iamia/backend:1.1.0
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "iamia"]
              args: ["ingest", "--from-web", "--if-changed"]
              envFrom:
                - configMapRef:
                    name: iamia-config
                - secretRef:
                    name: iamia-secrets
              env:
                # Igual que migrate: directo al primario por el statement_timeout largo.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: iamia-secrets
                      key: DATABASE_URL_DIRECT
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
