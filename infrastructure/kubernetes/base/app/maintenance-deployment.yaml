# Sweeper (republica lo que quedó en PostgreSQL sin llegar a la cola) y tareas periódicas:
# retención, purgas y vencimientos. Tiene que haber UNA sola réplica: Recreate baja la vieja
# antes de levantar la nueva. Sin PDB a propósito (un drain puede moverlo; se recupera solo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance
  labels:
    app.kubernetes.io/name: iamia
    app.kubernetes.io/component: maintenance
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iamia
      app.kubernetes.io/component: maintenance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iamia
        app.kubernetes.io/component: maintenance
    spec:
      serviceAccountName: iamia
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maintenance
          image: registry.example.org/iamia/backend:1.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "iamia"]
          args: ["maintenance"]
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iamia-config
            - secretRef:
                name: iamia-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
