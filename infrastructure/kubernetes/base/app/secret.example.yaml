# Solo de referencia: NO está en kustomization.yaml y no se aplica.
# En los clusters el Secret iamia-secrets lo crea External Secrets desde Vault (externalsecret.yaml).
# Sirve para saber qué claves cargar en Vault (iamia/app) o, en un entorno de prueba sin Vault,
# para completarlo a mano. Nunca commitear este archivo con valores reales.
# Las claves de cifrado y tokens propios se generan con: python -m iamia gen-secrets
apiVersion: v1
kind: Secret
metadata:
  name: iamia-secrets
  namespace: iamia
type: Opaque
stringData:
  # Por el pooler (modo sesión). Usuario y contraseña iguales a los de iamia-db-app-credentials.
  DATABASE_URL: postgresql://iamia:CHANGE_ME@iamia-db-pooler-rw.iamia.svc:5432/iamia
  # Directo al primario: lo usan migrate e ingest (fijan su propio statement_timeout al conectar
  # y PgBouncer no reenvía ese parámetro).
  DATABASE_URL_DIRECT: postgresql://iamia:CHANGE_ME@iamia-db-rw.iamia.svc:5432/iamia
  # Misma contraseña que iamia-redis.
  REDIS_URL: redis://:CHANGE_ME@redis.iamia.svc:6379/0
  # Con FQDN: KEDA lee esta misma URL desde su namespace. Credenciales = iamia-rabbitmq-user.
  AMQP_URL: amqp://iamia:CHANGE_ME@iamia-rabbitmq.iamia.svc:5672/iamia
  LLM_API_KEY: CHANGE_ME
  EMBEDDINGS_API_KEY: CHANGE_ME
  DATA_ENCRYPTION_KEYS: CHANGE_ME
  PSEUDONYMIZATION_KEY: CHANGE_ME
  WEBCHAT_TOKEN_SECRET: CHANGE_ME
  # Lo agrega el CDN/WAF delante del ingress en la cabecera X-Edge-Auth (protege /v1/chat).
  EDGE_SHARED_SECRET: CHANGE_ME
  WHATSAPP_ACCESS_TOKEN: CHANGE_ME
  WHATSAPP_APP_SECRET: CHANGE_ME
  WHATSAPP_VERIFY_TOKEN: CHANGE_ME
  INSTAGRAM_ACCESS_TOKEN: CHANGE_ME
  INSTAGRAM_APP_SECRET: CHANGE_ME
  INSTAGRAM_VERIFY_TOKEN: CHANGE_ME
  MESSENGER_PAGE_ACCESS_TOKEN: CHANGE_ME
  MESSENGER_APP_SECRET: CHANGE_ME
  MESSENGER_VERIFY_TOKEN: CHANGE_ME
  TELEGRAM_BOT_TOKEN: CHANGE_ME
  TELEGRAM_WEBHOOK_SECRET: CHANGE_ME
  X_WEBHOOK_SECRET: CHANGE_ME
  X_CLIENT_SECRET: CHANGE_ME
  EMAIL_INBOUND_SECRET: CHANGE_ME
  # El usuario de SMTP también va acá y no en el ConfigMap: junto con la contraseña es una credencial.
  SMTP_USERNAME: CHANGE_ME
  SMTP_PASSWORD: CHANGE_ME
  TWILIO_AUTH_TOKEN: CHANGE_ME
