# Consola de operadores en un host aparte. Todo pasa por oauth2-proxy (login OIDC), que reenvía
# a la API con el token en Authorization. La API de administración no se publica en
# asistente.example.org.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iamia-console
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/component: auth-proxy
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 3m
    # Las cookies y cabeceras de oauth2-proxy (tokens JWT) superan el buffer por defecto.
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/app-root: /console/
    # Opcional: limitar a la red de la organización o a la VPN.
    # nginx.ingress.kubernetes.io/whitelist-source-range: 192.0.2.0/24
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - consola.example.org
      secretName: consola-tls
  rules:
    - host: consola.example.org
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
          - path: /console
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
          - path: /admin/api
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
