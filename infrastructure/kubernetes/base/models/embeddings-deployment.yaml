# Embeddings (BAAI/bge-m3, 1024 dimensiones) con vLLM en modo pooling. Una GPU por réplica:
# 1 por servidor de 8 GPU (ver llm-deployment.yaml). Lo usan worker (RAG), api (caché
# semántica) e ingest (indexado).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: embeddings
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: embeddings
    spec:
      serviceAccountName: vllm
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vllm
              app.kubernetes.io/component: embeddings
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: vllm
          # Fijada por digest; misma imagen que el LLM. Validar en el servidor antes de producción.
          image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - BAAI/bge-m3
            # Verificar con la versión fijada: en vLLM anteriores el equivalente es --task=embed.
            - --runner=pooling
            - --host=0.0.0.0
            - --port=8000
            - --max-model-len=8192
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iamia-secrets
                  key: EMBEDDINGS_API_KEY
            - name: HF_HOME
              value: /models/huggingface
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HOME
              value: /tmp/home
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: NUMBA_CACHE_DIR
              value: /tmp/numba
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
