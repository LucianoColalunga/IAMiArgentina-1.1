# De a una réplica por vez. Con un solo servidor GPU un drain no puede reubicar los pods
# (no hay otro nodo con GPU libres): el mantenimiento de ese nodo implica corte del LLM.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: llm
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: llm
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: embeddings
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: embeddings
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: embeddings
