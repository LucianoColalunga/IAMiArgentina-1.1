# PodMonitors para los procesos sin Service y para los pods de los operadores.
# Roles de la app: job = worker | dispatcher | maintenance (como en docker compose).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: iamia-roles
  labels:
    app.kubernetes.io/name: iamia
    release: kube-prometheus-stack
spec:
  jobLabel: app.kubernetes.io/component
  selector:
    matchLabels:
      app.kubernetes.io/name: iamia
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["worker", "dispatcher", "maintenance"]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
# Instancias de PostgreSQL (exporter de CNPG en el puerto "metrics", 9187).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: iamia-db
  labels:
    app.kubernetes.io/name: postgresql
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: iamia-db
    matchExpressions:
      - key: cnpg.io/poolerName
        operator: DoesNotExist
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
# PgBouncer (puerto "metrics", 9127).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: iamia-db-pooler-rw
  labels:
    app.kubernetes.io/name: pgbouncer
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/poolerName: iamia-db-pooler-rw
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
