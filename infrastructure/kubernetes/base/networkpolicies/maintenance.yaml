# Maintenance: solo datos y cola.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maintenance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: iamia
      app.kubernetes.io/component: maintenance
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: iamia-db-pooler-rw
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iamia-rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
