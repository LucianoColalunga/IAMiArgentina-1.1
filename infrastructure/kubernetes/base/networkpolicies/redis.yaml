# Redis: solo lo usan los roles de la app. No sale a ningún lado (salvo DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["iamia"]
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "worker", "dispatcher", "maintenance"]
      ports:
        - protocol: TCP
          port: 6379
  egress: []
