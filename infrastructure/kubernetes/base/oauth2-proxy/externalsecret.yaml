# Cliente OIDC de la consola en el IdP y secreto de cookies de oauth2-proxy.
# client-id: usar "iamia-admin", así el aud del ID token coincide con OIDC_AUDIENCE de la API.
# cookie-secret: 32 bytes aleatorios (por ejemplo: openssl rand -base64 32 | head -c 32).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/component: auth-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: oauth2-proxy
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef:
        key: iamia/oauth2-proxy
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: iamia/oauth2-proxy
        property: client_secret
    - secretKey: cookie-secret
      remoteRef:
        key: iamia/oauth2-proxy
        property: cookie_secret
