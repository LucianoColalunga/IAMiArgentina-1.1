# Credenciales de PostgreSQL desde Vault.
# - iamia-db-app-credentials: dueño de la base (usuario iamia). CNPG lo usa al crear la base y
#   después mantiene la contraseña sincronizada si cambia. La misma contraseña va en
#   DATABASE_URL y DATABASE_URL_DIRECT de iamia/app.
# - iamia-db-backup-s3: acceso al bucket de backups (WAL + base backups).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iamia-db-app-credentials
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: iamia-db-app-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: iamia
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: iamia/postgres
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iamia-db-backup-s3
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: iamia-db-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: iamia/backup-s3
        property: access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: iamia/backup-s3
        property: secret_access_key
