# Usuario de la app en RabbitMQ (lo importa el User de topology.yaml).
# Tiene que coincidir con el usuario y la contraseña de AMQP_URL en iamia/app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iamia-rabbitmq-user
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: iamia-rabbitmq-user
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: iamia/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: iamia/rabbitmq
        property: password
