# Contraseña de Redis (requirepass). La misma va dentro de REDIS_URL en iamia/app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iamia-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: iamia-redis
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: iamia/redis
        property: password
