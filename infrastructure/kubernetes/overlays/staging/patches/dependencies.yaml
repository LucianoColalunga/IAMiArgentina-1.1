# RabbitMQ de un nodo (las colas quorum funcionan igual, sin tolerancia a fallas). El operador
# no permite bajar réplicas en un cluster existente: staging arranca así desde cero.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: iamia-rabbitmq
spec:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  template:
    spec:
      containers:
        - name: redis
          env:
            - name: REDIS_MAXMEMORY
              value: 256mb
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
# Un solo LLM y un embeddings: alcanza para probar, no para carga.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: oauth2-proxy
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://idp.example.org/realms/iamia-staging
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://consola.staging.example.org/oauth2/callback
